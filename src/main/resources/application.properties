# =========================================================
#  App
# =========================================================
spring.application.name=ai-app
server.port=8080

# Load secrets from a .env file in the project root (if present)
spring.config.import=optional:file:.env[.properties]

# Java 21 virtual threads: good for blocking LLM calls
spring.threads.virtual.enabled=true

# =========================================================
#  Spring AI -> OpenRouter (OpenAI-compatible)
# =========================================================
# Connection
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=2

# Optional: shows your app name on OpenRouter's dashboard/leaderboard
spring.ai.openai.custom-headers.[HTTP-Referer]=http://localhost:8080
spring.ai.openai.custom-headers.[X-Title]=ai-app

# Chat model defaults (can be overridden per request)
spring.ai.openai.chat.model=openai/gpt-4o
spring.ai.openai.chat.temperature=0.7
spring.ai.openai.chat.max-tokens=1000

# Spring AI retry (default is 10 attempts with up to 3 min backoff - too much for dev)
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=20s
spring.ai.retry.on-client-errors=false

# =========================================================
#  Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info

# =========================================================
#  Logging
# =========================================================
logging.level.org.springframework.ai=INFO

# =========================================================
#  WeatherAPI
# =========================================================
weather.api-key=${WEATHER_API_KEY:}